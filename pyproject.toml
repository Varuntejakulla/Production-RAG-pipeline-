[project]
name = "production-rag-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Varuntejakulla", email = "varuneeeaims@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.3.18",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.1",
    "langchain-huggingface>=1.2.2",
    "langsmith>=0.12.1",
    "openpyxl>=3.1.5",
    "pypdf>=6.16.2",
    "python-docx>=1.2.0",
    "sentence-transformers>=6.0.1",
]

[project.scripts]
production-rag-pipeline = "production_rag_pipeline:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
